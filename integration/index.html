<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0;url=/?view=integration"><meta name="robots" content="noindex"><title>Redirecting · Governance as Code</title></head>
<body><p>Redirecting to the <a id="destination" href="/?view=integration">new Governance as Code interface</a>.</p>
<script>
(function(){
  var p=new URLSearchParams(location.search), next=new URLSearchParams();
  next.set('view','integration');
  var scenario=p.get('scenario') || null;
  if(scenario)next.set('scenario',scenario);
  var u='/?'+next.toString()+(location.hash||'');
  document.getElementById('destination').href=u;
  location.replace(u);
})();
</script></body></html>
