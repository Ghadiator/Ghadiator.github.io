name: Publish verified GovernanceAsCode 7.5.10 single-canvas frontend
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-gac-v7510.yml]
permissions:
  contents: write
concurrency:
  group: gac-public-static-7510
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-79e8-8211-8d86-6a396296857f/raw?se=2026-11-03T19%3A33%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=845d0441-afdc-55b7-8f5f-6506f266c300&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T11%3A54%3A34Z&ske=2026-11-04T11%3A54%3A34Z&sks=b&skv=2026-02-06&sig=YLHccmjED4%2BcppniTbSese9u%2BGPTykfgWr433pm8YIY%3D"
      ARTIFACT_SHA256: "f220c18234b9ad64b3e653a142380df09fa85fdc56ce125756ed62327382a72b"
      SOURCE_SHA: "c452c44372af8849ca8427e86cab4e24d25ceea7"
    steps:
      - uses: actions/checkout@v4
      - name: Verify the immutable public artifact and evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 "$ARTIFACT_URL" -o /tmp/gac.zip
          echo "$ARTIFACT_SHA256  /tmp/gac.zip" | sha256sum -c -
          mkdir -p /tmp/gac-7510
          unzip -q /tmp/gac.zip -d /tmp/gac-7510
          for p in index.html architecture/index.html ai-assurance/index.html red-team/index.html safety-origin/index.html dashboard/index.html token-economics/index.html governance/index.html; do test -s "/tmp/gac-7510/$p"; done
          test -d /tmp/gac-7510/_next/static
          grep -q 'Public read-only reference' /tmp/gac-7510/index.html
          grep -q 'Understand the data' /tmp/gac-7510/architecture/index.html
          grep -q 'Understand the workflow' /tmp/gac-7510/architecture/index.html
          grep -q 'Replay a case' /tmp/gac-7510/architecture/index.html
          grep -q 'Try a new case' /tmp/gac-7510/architecture/index.html
          if find /tmp/gac-7510 -type f \( -name '*.py' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.db' \) | grep -q .; then echo 'Unexpected backend or secret'; exit 1; fi
      - name: Overlay the compiled public reference, preserving all prior records
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.github/' /tmp/gac-7510/ ./
          touch .nojekyll
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/tmp/gac-7510')
          digest=hashlib.sha256()
          for p in sorted(root.rglob('*')):
            if p.is_file():
              digest.update(str(p.relative_to(root)).encode())
              digest.update(hashlib.sha256(p.read_bytes()).digest())
          old=json.loads(Path('.site-release.json').read_text())
          old.update({
            'mode':'public-static-read-only',
            'source_repo':'Ghadiator/generic-agentic-validation',
            'source_branch':'feat/governance-visual-atlas-20261103',
            'source_commit':os.environ['SOURCE_SHA'],
            'app_version':'7.5.10',
            'output_digest_sha256':digest.hexdigest(),
            'release_artifact_sha256':os.environ['ARTIFACT_SHA256'],
            'published_at_utc':datetime.now(timezone.utc).isoformat(),
            'backend_available':False,'live_ai_available':False,'live_approvals_available':False
          })
          Path('.site-release.json').write_text(json.dumps(old,indent=2)+'\n')
          PY
          python3 scripts/check-native-release.py
          git diff --check
      - name: Commit the public release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "deploy: GovernanceAsCode 7.5.10 simplified architecture and measured provider evidence"
          git push origin HEAD:main
