name: Modular architecture browser smoke
on:
  push:
    branches: [main, fix/modular-architecture-embedded-view]
  pull_request:
    paths:
      - 'app.js'
      - 'assets/safety-to-governance.js'
      - 'assets/safety-to-governance.css'
      - 'assets/architecture-design.css'
      - 'architecture/index.html'
      - 'assets/architecture-embed.css'
      - 'scripts/check-architecture-browser.mjs'
      - 'assets/architecture-run-model.js'
      - 'scripts/check-architecture-run-model.cjs'
      - 'assets/architecture-execution.js'
      - 'assets/architecture-case-generator.js'
      - 'assets/supplier-workbook.js'
      - 'scripts/check-architecture-case-generator.cjs'
      - 'assets/architecture-module-map.css'
      - 'assets/architecture-module-inspector.js'
      - 'assets/architecture-governance.js'
      - 'assets/architecture-module-inspector.css'
      - 'scripts/check-architecture-module-inspector.cjs'
      - 'index.html'
      - 'assets/sidebar-brand-footer.css'
      - 'architecture-embed/**'
      - '.github/workflows/architecture-browser-check.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Find Chrome
        run: |
          which google-chrome || which chromium || true
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; fi
          if [ -x /usr/bin/chromium ]; then echo "CHROME_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"; fi
      - name: Start browser-test server with proposed fixes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/architecture-test-http.log 2>&1 &
          echo "TEST_ORIGIN=http://127.0.0.1:8765" >> "$GITHUB_ENV"
          sleep 2
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/architecture/
      - name: Verify fixed modular Architecture and its real React interactions
        run: node scripts/check-architecture-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-embedded-chromium
          path: architecture-embedded-test.png
