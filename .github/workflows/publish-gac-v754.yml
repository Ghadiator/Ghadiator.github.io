name: Publish verified GovernanceAsCode 7.5.4 canvas layout
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-gac-v754.yml]
permissions:
  contents: write
concurrency:
  group: public-static-gac-v754
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b39c-81f4-ad11-12b76762a30c/raw?se=2026-11-03T09%3A44%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=c9e60e3e-0f61-5122-bc48-394029d06cf3&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T06%3A19%3A04Z&ske=2026-11-04T06%3A19%3A04Z&sks=b&skv=2026-02-06&sig=wTU/8AZFjkJjIkrGx/Qxn0cgPhEzMAckvleRqo5Vj9w%3D'
      EXPECTED_DIGEST: '763a8e1f56108d928601f27e964013ac4aeb8d3bbb96d89bd0078f0f5ff31ce9'
      SOURCE_SHA: '88cef2660b47eb8747a7ac711f242a48b9e8a739'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exact compiled public static artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fLsS --retry 3 --max-time 150 "$RELEASE_ARTIFACT_URL" -o /tmp/gac-static.zip
          printf '%s  %s\n' "$EXPECTED_DIGEST" /tmp/gac-static.zip | sha256sum -c -
          mkdir -p /tmp/gac-static
          unzip -q /tmp/gac-static.zip -d /tmp/gac-static
          test -s /tmp/gac-static/index.html
          test -s /tmp/gac-static/architecture/index.html
          test -d /tmp/gac-static/_next/static
          grep -q 'Public read-only reference' /tmp/gac-static/index.html
          grep -q 'Pydantic Models' /tmp/gac-static/architecture/index.html
          grep -q 'Recorded Cases' /tmp/gac-static/architecture/index.html
          grep -q 'Try It Yourself' /tmp/gac-static/architecture/index.html
          if find /tmp/gac-static -type f \( -name '*.py' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.db' \) | grep -q .; then
            echo 'Unexpected backend or secret file in artifact'; exit 1
          fi
      - name: Overlay reviewed static export preserving existing evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a --exclude='.git/' --exclude='.github/' /tmp/gac-static/ ./
          touch .nojekyll
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          output=Path('/tmp/gac-static')
          digest=hashlib.sha256()
          for p in sorted(output.rglob('*')):
              if p.is_file():
                  digest.update(str(p.relative_to(output)).encode())
                  digest.update(hashlib.sha256(p.read_bytes()).digest())
          old=json.loads(Path('.site-release.json').read_text())
          old.update({
            'mode':'public-static-read-only',
            'source_repo':'Ghadiator/generic-agentic-validation',
            'source_branch':'feat/governance-visual-atlas-20261103',
            'source_commit':os.environ['SOURCE_SHA'],
            'app_version':'7.5.4',
            'output_digest_sha256':digest.hexdigest(),
            'release_artifact_sha256':os.environ['EXPECTED_DIGEST'],
            'published_at_utc':datetime.now(timezone.utc).isoformat(),
            'backend_available':False,
            'live_ai_available':False,
            'live_approvals_available':False,
          })
          Path('.site-release.json').write_text(json.dumps(old,indent=2)+'\n')
          PY
          python3 scripts/check-native-release.py
          git diff --check
      - name: Commit release with rollback history
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No compiled changes'; exit 0; fi
          git commit -m "deploy: GovernanceAsCode v7.5.4 full-width Pydantic canvas"
          git push origin HEAD:main
