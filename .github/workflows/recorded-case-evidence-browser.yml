name: Recorded-case source evidence browser acceptance
on:
  pull_request:
    paths:
      - "workspace/index.html"
      - "workspace/case/index.html"
      - "failure-lab/index.html"
      - "data/cases.json"
      - "data/scenarios/**"
      - "data/recorded-kpi-evidence.json"
      - "data/synthetic-governance-metrics.json"
      - "scripts/check-recorded-source*"
      - "scripts/check-validation-clarity*"
      - "scripts/check-public-navigation-scripts.mjs"
      - ".github/workflows/recorded-case-evidence-browser.yml"
  push:
    branches: [main]
    paths:
      - "workspace/index.html"
      - "workspace/case/index.html"
      - "failure-lab/index.html"
      - "data/cases.json"
      - "data/scenarios/**"
      - "data/recorded-kpi-evidence.json"
      - "data/synthetic-governance-metrics.json"
      - "scripts/check-recorded-source*"
      - "scripts/check-validation-clarity*"
      - "scripts/check-public-navigation-scripts.mjs"
permissions:
  contents: read
jobs:
  recorded-case:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify real fixture integrity and native test syntax
        run: |
          node --check scripts/check-recorded-source-browser.cjs
          node --check scripts/check-validation-clarity-browser.cjs
          node scripts/check-recorded-source-evidence.mjs
          node scripts/check-public-navigation-scripts.mjs
      - name: Install browser driver
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
          command -v google-chrome || command -v chromium
      - name: Start public Pages server on the canonical workspace
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gac-pages.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/workspace/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gac-pages.log
          exit 1
      - name: Exercise native case provenance and human-review simulation
        run: |
          node scripts/check-recorded-source-browser.cjs
          node scripts/check-validation-clarity-browser.cjs
