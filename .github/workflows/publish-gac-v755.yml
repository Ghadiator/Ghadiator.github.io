name: Publish verified GovernanceAsCode holistic 7.5.5 interface
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-gac-v755.yml]
permissions:
  contents: write
concurrency:
  group: public-static-gac-v755
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4d6c-81f4-b7f8-824219e1b283/raw?se=2026-11-03T13%3A53%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=d5b01613-064c-5d97-82d4-bcc4ea387737&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T10%3A41%3A03Z&ske=2026-11-04T10%3A41%3A03Z&sks=b&skv=2026-02-06&sig=3cooMKRyJ6o5SfY0PoL3FX/iPWVYNASCRQAZLHDoes0%3D'
      EXPECTED_DIGEST: '590a7e57c47987a190ae5cfc1ee783a4744a3790b75a30fd68b1715328ab5d6d'
      SOURCE_SHA: '413f6880a699d98690a60c5e2abcee3c1c75c055'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exact compiled, public-only source artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fLsS --retry 3 --max-time 150 "$RELEASE_ARTIFACT_URL" -o /tmp/gac-static.zip
          printf '%s  %s\n' "$EXPECTED_DIGEST" /tmp/gac-static.zip | sha256sum -c -
          mkdir -p /tmp/gac-static
          unzip -q /tmp/gac-static.zip -d /tmp/gac-static
          test -s /tmp/gac-static/index.html
          test -s /tmp/gac-static/architecture/index.html
          test -s /tmp/gac-static/ai-assurance/index.html
          test -s /tmp/gac-static/dashboard/index.html
          test -s /tmp/gac-static/governance/index.html
          test -d /tmp/gac-static/_next/static
          grep -q 'Public read-only reference' /tmp/gac-static/index.html
          grep -q 'A governed, multi-tier validation workflow' /tmp/gac-static/index.html
          grep -q 'Explore the mechanisms' /tmp/gac-static/index.html
          grep -q 'Pydantic Models' /tmp/gac-static/architecture/index.html
          grep -q 'Try It Yourself' /tmp/gac-static/architecture/index.html
          grep -q 'Interrogate a failure' /tmp/gac-static/ai-assurance/index.html
          grep -q 'Behind every KPI' /tmp/gac-static/dashboard/index.html
          if find /tmp/gac-static -type f \( -name '*.py' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.db' \) | grep -q .; then
            echo 'Unexpected backend or credential material in public export'; exit 1
          fi
      - name: Overlay reviewed static export without removing evidence and links
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a --exclude='.git/' --exclude='.github/' /tmp/gac-static/ ./
          touch .nojekyll
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          output=Path('/tmp/gac-static')
          digest=hashlib.sha256()
          for p in sorted(output.rglob('*')):
              if p.is_file():
                  digest.update(str(p.relative_to(output)).encode())
                  digest.update(hashlib.sha256(p.read_bytes()).digest())
          old=json.loads(Path('.site-release.json').read_text())
          old.update({
            'mode':'public-static-read-only',
            'source_repo':'Ghadiator/generic-agentic-validation',
            'source_branch':'feat/governance-visual-atlas-20261103',
            'source_commit':os.environ['SOURCE_SHA'],
            'app_version':'7.5.5',
            'output_digest_sha256':digest.hexdigest(),
            'release_artifact_sha256':os.environ['EXPECTED_DIGEST'],
            'published_at_utc':datetime.now(timezone.utc).isoformat(),
            'backend_available':False,
            'live_ai_available':False,
            'live_approvals_available':False
          })
          Path('.site-release.json').write_text(json.dumps(old,indent=2)+'\n')
          PY
          python3 scripts/check-native-release.py
          git diff --check
      - name: Commit visual release preserving rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No compiled changes'; exit 0; fi
          git commit -m "deploy: GovernanceAsCode holistic figure-led v7.5.5"
          git push origin HEAD:main
