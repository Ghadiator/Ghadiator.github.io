name: Native workbench integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-native-release.py
      - name: Verify every recorded committee role and CoVe event
        run: node scripts/check-committee-case-evidence.cjs
