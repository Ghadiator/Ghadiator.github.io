name: Native workbench integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# Superseded read-only verification need not compete with newer source checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-native-release.py
      - name: Verify every recorded committee role and CoVe event
        run: node scripts/check-committee-case-evidence.cjs
