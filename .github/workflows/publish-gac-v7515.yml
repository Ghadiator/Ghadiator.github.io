name: Publish verified GovernanceAsCode 7.5.15 optional Pydantic models and architecture role map
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-gac-v7515.yml]
permissions:
  contents: write
concurrency:
  group: gac-public-static-7515
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-04e8-8210-9f20-647a1ad2f719/raw?se=2026-11-05T05%3A06%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=6479ef47-9b65-5c7a-87ec-831e09e1e7b4&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T04%3A01%3A47Z&ske=2026-11-06T04%3A01%3A47Z&sks=b&skv=2026-02-06&sig=qrf2Jom3//HBm0cUA9s3L6pU5J7FSCvqB5vmKXTBzf4%3D"
      ARTIFACT_SHA256: "4cc2f3c3f0d455ca58b9bb6de8ab010d66b6f9dd0789550fbf4500a3fe886e91"
      SOURCE_SHA: "277089f7a6456c6f5e7eebb8dfb3db33647f4475"
    steps:
      - uses: actions/checkout@v4
      - name: Verify the immutable public artifact and evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 "$ARTIFACT_URL" -o /tmp/gac.zip
          echo "$ARTIFACT_SHA256  /tmp/gac.zip" | sha256sum -c -
          mkdir -p /tmp/gac-7515
          unzip -q /tmp/gac.zip -d /tmp/gac-7515
          for p in index.html architecture/index.html ai-assurance/index.html red-team/index.html safety-origin/index.html dashboard/index.html token-economics/index.html governance/index.html tickets/index.html tickets/new/index.html ticket/index.html inbound/index.html monitor/index.html pool-analytics/index.html; do test -s "/tmp/gac-7515/$p"; done
          test -d /tmp/gac-7515/_next/static
          grep -q 'Public read-only reference' /tmp/gac-7515/index.html
          grep -q 'Understand the data' /tmp/gac-7515/architecture/index.html
          grep -q 'Understand the workflow' /tmp/gac-7515/architecture/index.html
          grep -q 'Replay a case' /tmp/gac-7515/architecture/index.html
          grep -q 'Try a new case' /tmp/gac-7515/architecture/index.html
          grep -q 'Token economics' /tmp/gac-7515/token-economics/index.html
          grep -q 'The business question' /tmp/gac-7515/index.html
          grep -q 'Grounded checks → bypass Tier-3 committee' /tmp/gac-7515/index.html
          grep -q 'Risk weights' /tmp/gac-7515/governance/index.html
          grep -q 'Six controls behind a bounded model budget' /tmp/gac-7515/token-economics/index.html
          grep -q 'Recorded collection register' /tmp/gac-7515/tickets/index.html
          grep -q 'Optional: inspect how the source models relate' /tmp/gac-7515/architecture/index.html
          grep -q 'case_id: Identifier' /tmp/gac-7515/architecture/index.html
          grep -q 'declared attributes' /tmp/gac-7515/architecture/index.html
          grep -q 'Meet the roles behind controlled reasoning' /tmp/gac-7515/index.html
          if find /tmp/gac-7515 -type f \( -name '*.py' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.db' \) | grep -q .; then echo 'Unexpected backend or secret'; exit 1; fi
      - name: Overlay the compiled public reference, preserving all prior records
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.github/' /tmp/gac-7515/ ./
          touch .nojekyll
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/tmp/gac-7515')
          digest=hashlib.sha256()
          for p in sorted(root.rglob('*')):
            if p.is_file():
              digest.update(str(p.relative_to(root)).encode())
              digest.update(hashlib.sha256(p.read_bytes()).digest())
          old=json.loads(Path('.site-release.json').read_text())
          old.update({
            'mode':'public-static-read-only',
            'source_repo':'Ghadiator/generic-agentic-validation',
            'source_branch':'feat/governance-visual-atlas-20261103',
            'source_commit':os.environ['SOURCE_SHA'],
            'app_version':'7.5.15',
            'output_digest_sha256':digest.hexdigest(),
            'release_artifact_sha256':os.environ['ARTIFACT_SHA256'],
            'published_at_utc':datetime.now(timezone.utc).isoformat(),
            'backend_available':False,'live_ai_available':False,'live_approvals_available':False
          })
          Path('.site-release.json').write_text(json.dumps(old,indent=2)+'\n')
          PY
          python3 scripts/check-native-release.py
          git diff --check
      - name: Commit the public release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "deploy: GovernanceAsCode 7.5.15 optional typed contracts and full modular role map; original story retained"
          git push origin HEAD:main
