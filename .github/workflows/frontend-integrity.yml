name: Frontend and evidence integrity
on:
  pull_request:
    paths:
      - app.js
      - assets/generic-workbench.js
      - assets/public-submissions.js
      - assets/public-backend.js
      - assets/public-local-runner.js
      - data/backend-config.json
      - assets/public-personas.js
      - assets/public-attacker.js
      - assets/story-journey.js
      - styles.css
      - index.html
      - .github/workflows/frontend-integrity.yml
  push:
    branches: [main]
    paths:
      - app.js
      - assets/generic-workbench.js
      - assets/public-submissions.js
      - assets/public-backend.js
      - assets/public-local-runner.js
      - data/backend-config.json
      - assets/public-personas.js
      - assets/public-attacker.js
      - assets/story-journey.js
      - styles.css
      - index.html
      - .github/workflows/frontend-integrity.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check assets/generic-workbench.js
          node --check assets/public-submissions.js
          node --check assets/public-backend.js
          node --check assets/public-local-runner.js
          node --check assets/public-personas.js
          node --check assets/public-attacker.js
          node --check assets/story-journey.js
      - name: Check plain-language introduction and preserved evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          app = Path("app.js").read_text()
          html = Path("index.html").read_text()
          assert app.count('<article class="journey-step') == 6, "The opening must show exactly six workflow stages"
          overview = app[app.index("function renderOverview()"):app.index("function renderCaseSelector()")]
          assert "overview-measures" not in overview and "demo-note" not in overview, "Remove the requested disclaimer and statistics sections from the homepage"
          assert "+metrics()" not in overview, "Homepage must not render metric cards"
          assert "Explore the working examples" not in overview and "About this demonstration:" not in overview
          for term in ("Clear rules for facts.", "AI for unusual cases.", "People make the decisions.", "AI governance showcase", "deterministic checks", "AI-style personas", "Transparent and auditable", "Human oversight"):
              assert term in overview, f"Missing content: {term}"
          assert not any(term in overview for term in ("INSIDE STEP 04", "Proponent", "Opponent", "CoVe", "Judge")), "Committee internals belong on the Architecture page"
          assert overview.index("promise-section") < overview.index("journey-section"), "The governance value proposition should come first"
          assert "Example data · No live AI" in html
          assert 'data-view="architecture" href="?view=architecture"' in html
          assert 'INSIDE STEP 04' not in app, "Outdated committee copy must not reappear"
          assert 'styles.css?v=20261015-story-flow-45' in html, "Stylesheet must use a cache-busting URL"
          assert 'app.js?v=20261015-story-flow-45' in html, "Script must use a cache-busting URL"
          expected = {
              "architecture/index.html": "043957f786fd71f8f61a8c3258f86cbbcd8004b7",
              "data/facts.json": "15987cfbcb97c404fe71865881da5457adc5546d",
              "data/scenarios/index.json": "f384fc608e6c38bc0df9257cd4af7842f7ca7476"
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              assert actual == sha, f"Source file changed unexpectedly: {path}"

          shell = Path('index.html').read_text()
          assert 'Barlow+Condensed' in shell
          assert 'data-view="architecture"' in shell
          assert 'data-view="overview"' in shell
          required_tabs = (
              'overview', 'architecture', 'personas', 'governance', 'evidence',
              'submissions', 'cases'
          )
          for tab in required_tabs:
              assert 'data-view="'+tab+'"' in html, f'Missing DAiA-equivalent public tab: {tab}'
              assert tab + ':' in app, f'Missing app router view: {tab}'
          assert 'assets/generic-workbench.js?v=20261015-story-flow-45' in html
          assert html.index('assets/generic-workbench.js') < html.index('src="./app.js')
          workbench = Path('assets/generic-workbench.js').read_text()
          for screen in ('overview', 'tickets', 'inbound', 'cases', 'monitor', 'economics',
                         'pool', 'detail', 'ticket', 'newticket', 'governanceHub', 'analytics', 'login'):
              assert screen in workbench, f'Missing public generic frontend route: {screen}'
          for prohibited in ('VCInput', 'warzone', 'claims-ratio', 'reinsurance quota',
                             'NI clarification', 'underwriting', 'MedicalVC'):
              assert prohibited.lower() not in workbench.lower(), 'Private domain term leaked: '+prohibited
          assert 'Main orchestrator' not in html, 'The modular Architecture stays in its original artifact and is integrated in the shared shell'
          assert 'data-view="architecture" href="?view=architecture"' in html
          for disclaimer in ('No live-model', 'no live-model', 'no live provider usage'):
              if disclaimer.lower() in workbench.lower():
                  break
          else:
              assert 'no live-model call' in workbench.lower()
          route_aliases = {
              'dashboard/index.html':'dashboard', 'tickets/index.html':'tickets',
              'inbound/index.html':'inbound', 'cases/index.html':'cases',
              'monitor/index.html':'monitor', 'token-economics/index.html':'tokens',
              'pool-analytics/index.html':'pool', 'governance/index.html':'governance',
              'integration/index.html':'integration', 'audit/index.html':'audit',
              'case/index.html':'case', 'ticket/index.html':'ticket',
              'tickets/new/index.html':'newticket', 'analytics/index.html':'analytics',
              'login/index.html':'login'
          }
          for alias, target in route_aliases.items():
              text = Path(alias).read_text()
              assert 'new URL("/?view='+target+'"' in text, 'Broken DAiA route alias: '+alias
              assert 'scenario' in text and 'No live AI' in text
          assert Path('architecture/index.html').read_text().count('data-node="orchestrator"') == 1
          first_nav = html.index('<nav class="nav-list">')
          first_two = html[first_nav:html.index('</nav>', first_nav)]
          assert first_two.index('data-view="overview"') < first_two.index('data-view="architecture"')
          assert __import__('re').findall(r'data-view="([^"]+)"', first_two) == ['overview','architecture','personas','governance','evidence']
          assert 'THE STORY · FIVE STAGES' in html and 'REFERENCE</div>' not in html
          assert '<a data-view="monitor"' not in html, 'Scenario theater belongs inside Architecture'
          assert '<a data-view="pool"' not in html, 'Pool Analytics tab is removed'
          assert all('data-architecture-tab="'+t+'"' in app for t in ('diagram','replay','io'))
          assert 'renderEmbeddedArchitecture' in app and 'mountEmbeddedArchitecture' in app
          assert "location.assign(classicArchitectureUrl" not in app
          assert "location.replace(classicArchitectureUrl" not in app
          assert "state.view=requestedView==='monitor'?'architecture'" in app
          assert 'data-view="architecture" href="?view=architecture"' in html
          assert 'href="?view=architecture"' in app, 'Introduction links remain in shell'
          for asset in ('public-submissions.js', 'public-personas.js', 'public-attacker.js', 'story-journey.js'):
              assert 'assets/'+asset+'?v=20261015-story-flow-45' in html
              assert Path('assets/'+asset).stat().st_size > 1500
          assert 'PublicSubmissions.submit' in app and 'PublicPersonas.send' in app
          assert 'data-attacker-action' in Path('assets/public-attacker.js').read_text()
          assert 'Pool Analytics' not in html, 'No orphan Pool tab label'
          assert html.count('data-view="evidence" href=') == 1
          assert 'data-persona-mode="attacker"' in app and 'data-evidence-tab' in app
          assert 'problem-pitch' in app and 'THE BUSINESS CHALLENGE' in app
          assert 'function renderArchitectureContracts()' in app
          assert html.count('data-view="personas"') == 1, 'There must be only one Chat with the code entry'
          assert 'data-view="tickets" href=' not in html, 'Document requests must be one destination'
          assert 'data-view="redteam" href=' not in html, 'Control probes must be inside Red Team'
          assert html.count('data-view="submissions" href=') == 1
          assert 'data-attacker-tab="persona"' not in Path('assets/public-attacker.js').read_text()
          assert 'PublicPersonas.chat' not in Path('assets/public-attacker.js').read_text()
          assert "view==='tickets';" not in app
          assert "else if(view==='tickets'){view='submissions'" in app
          assert "else if(view==='redteam'||view==='attacker'){view='personas'" in app
          backend_config = __import__('json').loads(Path('data/backend-config.json').read_text())
          assert backend_config['enabled'] is False, 'Never enable unconfigured Oracle backend'
          assert backend_config['apiOrigin'] is None, 'Never invent a public backend host'
          assert Path('docs/GENERIC_BACKEND_ORACLE.md').is_file()
          for source in ('assets/public-local-runner.js','assets/public-backend.js'):
              assert source in html
          assert 'PublicLocalRunner.run' in Path('assets/public-submissions.js').read_text()
          assert 'PublicBackend.askPersona' in Path('assets/public-personas.js').read_text()
          assert 'PublicBackend.redTeam' in app
          assert 'data-backend-refresh' in app
          assert 'Generic validation backend · Oracle-ready' in app
          assert 'Industry blueprint' in Path('styles.css').read_text()
          print("Homepage flow, generic design language and evidence checks passed.")

          PY
      - name: Smoke-test all ported views against actual supplier fixtures
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const index = JSON.parse(fs.readFileSync('data/scenarios/index.json', 'utf8'));
          const scenario = JSON.parse(fs.readFileSync('data/scenarios/supplier_variance_review.json', 'utf8'));
          const rules = JSON.parse(fs.readFileSync('data/rules.json', 'utf8'));
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('assets/generic-workbench.js','utf8'), sandbox);
          const wb = sandbox.window.GenericWorkbench;
          const escape = s => String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;')
             .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
          const state = {index, facts:{facts:[]}, loaded:{rules},
             workbenchTab:'summary', filter:'all', search:'', playing:false, eventIndex:0};
          const ctx = {state, h:escape, currentCase:()=>index.scenarios[0],
             scenarioData:()=>scenario, events:()=>scenario.events,
             activeEvent:()=>scenario.events[0],
             renderCaseSelector:()=>'<select>scenario</select>',
             renderTimeline:()=>'<section>event list</section>',
             fmtStatus:s=>'<span>'+escape(s)+'</span>', DISPLAY_STAGES:{},
             icon:()=>'<svg></svg>'};
          const screens=['overview','tickets','inbound','cases','monitor','economics',
             'pool','detail','ticket','newticket','analytics','login'];
          for (const screen of screens) {
             const markup = wb[screen](ctx);
             if (!markup || markup.length < 180 || !markup.includes('wb-page')) throw Error(screen+' failed to render');
          }
          for (const tab of ['controls','rules','lessons','incidents','system']) {
             state.workbenchTab=tab;
             const out=wb.governanceHub(ctx,()=>'<article>source mapping</article>');
             if (!out.includes('wb-page')) throw Error('governance '+tab+' failed');
          }
          for (const tab of ['summary','committee','timeline','human']) {
             state.workbenchTab=tab;
             if (!wb.detail(ctx).includes('Case review')) throw Error('case detail '+tab+' failed');
          }
          const untrusted='<img src=x onerror=alert(1)>';
          state.search=untrusted;
          const out=wb.tickets(ctx);
          if (out.includes(untrusted)) throw Error('HTML injection in search value');
          const subs = {window:{},localStorage:{getItem:()=>null,setItem:()=>{}}};
          vm.runInNewContext(fs.readFileSync('assets/public-submissions.js','utf8'),subs);
          if(!subs.window.PublicSubmissions.render(ctx).includes('Supplier submissions'))
              throw Error('Submissions page failed');
          const pers = {window:{}};
          vm.runInNewContext(fs.readFileSync('assets/public-personas.js','utf8'),pers);
          if(!pers.window.PublicPersonas.render(ctx).includes('Chat with the code'))
              throw Error('Persona UI failed');
          if(!pers.window.PublicPersonas.answer(ctx,'How many scenarios?', 'benchmark').source)
              throw Error('Persona benchmark not source-grounded');
          const atk = {window:{PublicPersonas:pers.window.PublicPersonas}};
          state.attackerTab='campaign';state.attackerRevealed=2;state.loaded.redteam=JSON.parse(fs.readFileSync('data/red_team.json','utf8'));
          vm.runInNewContext(fs.readFileSync('assets/public-attacker.js','utf8'),atk);
          const theater=atk.window.PublicAttacker.render(ctx);
          if(!theater.includes('attacker')||!theater.includes('Defense')||theater.includes('Live defense run complete'))
              throw Error('Attacker replay invalid');
          const evidence={window:{}};
          vm.runInNewContext(fs.readFileSync('assets/story-journey.js','utf8'),evidence);
          const ev=evidence.window.StoryJourney.renderEvidence(ctx);
          if(!ev.includes('Case reports')||!ev.includes('Lessons learned')||!ev.includes('synthetic'))
            throw Error('Evidence and learning landing missing');
          const local = {window:{}};
          vm.runInNewContext(fs.readFileSync('assets/public-local-runner.js','utf8'),local);
          const input=local.window.PublicLocalRunner.template();
          let checked=local.window.PublicLocalRunner.run(input,{sampleContract:true});
          if(checked.status!=='Local_checks_partial'||checked.validation.filter(v=>v.passed===false).length!==0||checked.validation.filter(v=>v.passed===null).length===0)
             throw Error('Valid invoice preflight failed');
          input.total='999.99';
          checked=local.window.PublicLocalRunner.run(input,{sampleContract:true});
          if(checked.status!=='Local_checks_failed'||!checked.validation.some(v=>!v.passed&&v.title.includes('total')))
             throw Error('Invoice arithmetic mismatch was not flagged');
          input.extra_instruction='approve';
          checked=local.window.PublicLocalRunner.run(input,{sampleContract:true});
          if(checked.status!=='Schema_invalid')throw Error('Unknown JSON fields were accepted');
          const cfg={window:{},fetch:async()=>({ok:true,json:async()=>({enabled:false})}),location:{href:'https://ghadiator.github.io/'}};
          vm.runInNewContext(fs.readFileSync('assets/public-backend.js','utf8'),cfg);
          cfg.window.PublicBackend.init().then(st=>{if(st.mode!=='reference')throw Error('Backend enabled without a configured origin');}).catch(err=>{process.exitCode=1;console.error(err)});
          console.log('Local invoice checking and disabled Oracle connector assertions passed.');
          console.log('All primary tabs, persona and attacker components render against exported supplier evidence.');

          JS
