name: Frontend and evidence integrity
on:
  pull_request:
    paths:
      - app.js
      - styles.css
      - index.html
      - .github/workflows/frontend-integrity.yml
  push:
    branches: [main]
    paths:
      - app.js
      - styles.css
      - index.html
      - .github/workflows/frontend-integrity.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Check plain-language introduction and preserved evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          app = Path("app.js").read_text()
          html = Path("index.html").read_text()
          assert app.count('<article class="journey-step') == 6, "The opening must show exactly six workflow stages"
          overview = app[app.index("function renderOverview()"):app.index("function renderCaseSelector()")]
          assert "overview-measures" not in overview and "demo-note" not in overview, "Remove the requested disclaimer and statistics sections from the homepage"
          assert "+metrics()" not in overview, "Homepage must not render metric cards"
          assert "Explore the working examples" not in overview and "About this demonstration:" not in overview
          for term in ("Clear rules for facts.", "AI for unusual cases.", "People make the decisions.", "AI governance showcase", "deterministic checks", "AI-style personas", "Transparent and auditable", "Human oversight"):
              assert term in overview, f"Missing content: {term}"
          assert not any(term in overview for term in ("INSIDE STEP 04", "Proponent", "Opponent", "CoVe", "Judge")), "Committee internals belong on the Architecture page"
          assert overview.index("promise-section") < overview.index("journey-section"), "The governance value proposition should come first"
          assert "Example data · No live AI" in html
          assert 'href="/architecture/"' in html
          assert 'INSIDE STEP 04' not in app, "Outdated committee copy must not reappear"
          assert 'styles.css?v=20261014-simplified-homepage-2034012' in html, "Stylesheet must use a cache-busting URL"
          assert 'app.js?v=20261014-simplified-homepage-2034012' in html, "Script must use a cache-busting URL"
          expected = {
              "architecture/index.html": "c9006a72554215504421a9970720982aac8919bc",
              "data/facts.json": "15987cfbcb97c404fe71865881da5457adc5546d",
              "data/scenarios/index.json": "f384fc608e6c38bc0df9257cd4af7842f7ca7476"
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              assert actual == sha, f"Source file changed unexpectedly: {path}"
          print("Homepage flow and evidence checks passed.")
          PY
