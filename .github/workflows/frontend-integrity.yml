name: Frontend and evidence integrity
on:
  pull_request:
    paths:
      - app.js
      - assets/assurance-design.css
      - assets/architecture-design.css
      - scripts/check-architecture-presentation.py
      - assets/generic-workbench.js
      - assets/public-submissions.js
      - assets/public-backend.js
      - assets/public-local-runner.js
      - data/backend-config.json
      - assets/public-personas.js
      - assets/public-attacker.js
      - assets/story-journey.js
      - assets/overview-agentic-flow.css
      - assets/architecture-execution.js
      - assets/architecture-module-map.css
      - assets/architecture-module-inspector.js
      - assets/architecture-governance.js
      - assets/architecture-module-inspector.css
      - scripts/check-architecture-module-inspector.cjs
      - assets/architecture-mobile-touch.css
      - scripts/check-architecture-module-map.cjs
      - styles.css
      - assets/sidebar-brand-footer.css
      - index.html
      - .github/workflows/frontend-integrity.yml
  push:
    branches: [main]
    paths:
      - app.js
      - assets/assurance-design.css
      - assets/architecture-design.css
      - scripts/check-architecture-presentation.py
      - assets/generic-workbench.js
      - assets/public-submissions.js
      - assets/public-backend.js
      - assets/public-local-runner.js
      - data/backend-config.json
      - assets/public-personas.js
      - assets/public-attacker.js
      - assets/story-journey.js
      - assets/overview-agentic-flow.css
      - styles.css
      - assets/sidebar-brand-footer.css
      - index.html
      - .github/workflows/frontend-integrity.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check assets/architecture-execution.js
          node --check assets/architecture-module-inspector.js
          node --check assets/architecture-governance.js
          node --check assets/generic-workbench.js
          node --check assets/public-submissions.js
          node --check assets/supplier-workbook.js
          node --check assets/public-backend.js
          node --check assets/public-local-runner.js
          node --check assets/public-personas.js
          node --check assets/public-attacker.js
          node --check assets/story-journey.js
      - name: Protect architecture semantics during presentation changes
        run: python3 scripts/check-architecture-presentation.py
      - name: Test architecture state against source fixtures
        run: node scripts/check-architecture-module-map.cjs
      - name: Check module definitions and recorded scenario inputs and outputs
        run: node scripts/check-architecture-module-inspector.cjs
      - name: Check plain-language introduction and preserved evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          app = Path("app.js").read_text()
          html = Path("index.html").read_text()
          assert app.count('<article class="journey-step') == 6, "The opening must show exactly six workflow stages"
          assert 'assets/overview-agentic-flow.css?v=20261019-linear-flow-63' in html, "Linear overview CSS must load"
          assert 'agentic-flow-sequence' in app, "Render a single connected sequence"
          assert app.count('class="af-sequence-item"') == 6, "Exactly six sequential modules"
          assert app.count('data-flow-module=') == 6, "Preserve the six authentic overview stages"
          assert app.count('class="af-sequence-number"') == 6, "Show each stage number"
          assert 'agentic-flow-routes' not in app and 'af-flow-merge' not in app and 'af-route-standard' not in app, "Remove fork and merge visuals"
          assert 'af-flow-loop' not in app and 'class="af-flow-arrow' not in app, "No confusing extra routes or arrows"
          assert 'Routine cases skip this step' in app, "Label AI-style advisory as optional"
          assert 'An authorised reviewer' in app and 'A corrected invoice' in app, "Preserve final human authority and correction explanation"
          assert 'content:"↓"' in Path('assets/overview-agentic-flow.css').read_text(), "Join stages with simple downward arrows"
          assert 'intro-guided-tour' not in app, "Do not reinstate the removed interactive walkthrough"
          overview = app[app.index("function renderOverview()"):app.index("function renderCaseSelector()")]
          assert "overview-measures" not in overview and "demo-note" not in overview, "Remove the requested disclaimer and statistics sections from the homepage"
          assert "+metrics()" not in overview, "Homepage must not render metric cards"
          assert "Explore the working examples" not in overview and "About this demonstration:" not in overview
          for term in ("Clear rules for facts.", "AI for unusual cases.", "People make the decisions.", "agreed terms", "scripted AI roles", "recorded runs"):
              assert term in overview, f"Missing content: {term}"
          assert not any(term in overview for term in ("INSIDE STEP 04", "Proponent", "Opponent", "CoVe", "Judge")), "Committee internals belong on the Architecture page"
          assert overview.index("overview-hero") < overview.index("original-workflow") < overview.index("journey-section"), "Keep one introduction followed by the manual and automated workflow views"
          assert "Example data · No live AI" in html
          assert 'data-view="architecture" href="?view=architecture"' in html
          assert 'INSIDE STEP 04' not in app, "Outdated committee copy must not reappear"
          assert 'styles.css?v=20261016-manual-flow-54' in html, "Stylesheet must use a cache-busting URL"
          assert 'app.js?v=20261021-merged-results-70' in html, "Script must use a cache-busting URL"
          # Preserve the existing modular architecture through presentation changes.
          protected_architecture = {
              'assets/architecture-execution.js': 'd3370d3d6edb77fc1637bbbac812d1a8d19d3af1',
              'assets/architecture-module-inspector.js': '1aa298ca20aec040e8ec6114d4da85c083bb1344',
              'assets/architecture-module-map.css': '731c54537813cc0b95d67e7caa63970a2989ab05',
              'assets/architecture-module-inspector.css': '1c2e3051e18015d19423fd21f35d8912b3fc4e43',
              'assets/architecture-mobile-touch.css': '70ab95d0a936719d646ba6c07a34038bd75c7e92',
              'assets/architecture-explained.js': 'bcc29b5824c0e01513fa55509d990c416df805aa',
              'assets/architecture-explained.css': '0917ad5b7a65d054a4ecbb60a72ce3080fa774a6',
          }
          for path, sha in protected_architecture.items():
              assert subprocess.check_output(["git", "hash-object", path], text=True).strip() == sha, f"Protected architecture changed: {path}"
          expected = {
              "data/facts.json": "15987cfbcb97c404fe71865881da5457adc5546d",
              "data/scenarios/index.json": "f384fc608e6c38bc0df9257cd4af7842f7ca7476"
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              assert actual == sha, f"Source file changed unexpectedly: {path}"

          shell = Path('index.html').read_text()
          assert 'Barlow+Condensed' in shell
          assert 'data-view="architecture"' in shell
          assert 'data-view="overview"' in shell
          required_tabs = (
              'overview', 'architecture', 'personas', 'governance', 'evidence',
              'submissions', 'cases'
          )
          for tab in required_tabs:
              assert 'data-view="'+tab+'"' in html, f'Missing DAiA-equivalent public tab: {tab}'
              assert tab + ':' in app, f'Missing app router view: {tab}'
          assert 'assets/generic-workbench.js?v=20261016-manual-flow-54' in html
          assert html.index('assets/generic-workbench.js') < html.index('src="./app.js')
          workbench = Path('assets/generic-workbench.js').read_text()
          for screen in ('overview', 'tickets', 'inbound', 'cases', 'monitor', 'economics',
                         'pool', 'detail', 'ticket', 'newticket', 'governanceHub', 'analytics', 'login'):
              assert screen in workbench, f'Missing public generic frontend route: {screen}'
          for prohibited in ('VCInput', 'warzone', 'claims-ratio', 'reinsurance quota',
                             'NI clarification', 'underwriting', 'MedicalVC'):
              assert prohibited.lower() not in workbench.lower(), 'Private domain term leaked: '+prohibited
          assert 'Main orchestrator' not in html, 'The modular Architecture stays in its original artifact and is integrated in the shared shell'
          assert 'data-view="architecture" href="?view=architecture"' in html
          for disclaimer in ('No live-model', 'no live-model', 'no live provider usage'):
              if disclaimer.lower() in workbench.lower():
                  break
          else:
              assert 'no live-model call' in workbench.lower()
          route_aliases = {
              'dashboard/index.html':'dashboard', 'tickets/index.html':'tickets',
              'inbound/index.html':'inbound', 'cases/index.html':'cases',
              'monitor/index.html':'monitor', 'token-economics/index.html':'tokens',
              'pool-analytics/index.html':'pool', 'governance/index.html':'governance',
              'integration/index.html':'integration', 'audit/index.html':'audit',
              'case/index.html':'case', 'ticket/index.html':'ticket',
              'tickets/new/index.html':'newticket', 'analytics/index.html':'analytics',
              'login/index.html':'login'
          }
          for alias, target in route_aliases.items():
              text = Path(alias).read_text()
              assert 'new URL("/?view='+target+'"' in text, 'Broken DAiA route alias: '+alias
              assert 'scenario' in text and 'No live AI' in text
          assert Path('architecture/index.html').read_text().count('data-node="orchestrator"') == 1
          # Public navigation is grouped by visitor goal, not by implementation stage.
          import re
          groups = (
              ('nav-start', ['overview']),
              ('nav-explore', ['architecture', 'cases', 'submissions']),
              ('nav-assurance', ['personas', 'governance', 'evidence']),
          )
          for group_id, expected_views in groups:
              nav_start = html.index('<nav class="nav-list" aria-labelledby="' + group_id + '">')
              nav_content = html[nav_start:html.index('</nav>', nav_start)]
              assert re.findall(r'data-view="([^"]+)"', nav_content) == expected_views
          assert 'EXPLORE THE WORKFLOW' in html and 'ASSURANCE & EVIDENCE' in html
          assert 'skip-link' in html and 'aria-controls="sidebar" aria-expanded="false"' in html
          assert 'function openMobileNav()' in app and 'function closeMobileNav(' in app
          assert 'event.key!==\'Tab\'' in app and "ev.key==='Escape'" in app
          assert 'REFERENCE</div>' not in html
          assert '<a data-view="monitor"' not in html, 'Scenario theater belongs inside Architecture'
          assert '<a data-view="pool"' not in html, 'Pool Analytics tab is removed'
          assert 'function renderWorkflowResults()' in app, "Recorded workflow results must follow the canvas"
          replay_section = app[app.index('function renderWorkflowResults()'):app.index('function refreshWorkflowResults()')]
          assert 'GenericWorkbench.monitor' not in replay_section, "Do not reintroduce duplicate monitor panels"
          assert "querySelector('.wb-two')" not in replay_section and "querySelector('.wb-committee')" not in replay_section
          assert 'Recorded workflow result' in replay_section, "Terminal outcome must be retained"
          assert 'id="workflow-results"' in app and 'syncFromFrame' in app
          assert 'id="architecture-event-rail"' in app and 'id="architecture-execution-dashboard"' in app
          assert 'decorateGraph' in app and 'refreshWorkflowResults' in app
          assert 'assets/architecture-execution.js?v=20261021-merged-results-70' in html
          assert html.index('assets/architecture-execution.js') < html.index('src="./app.js')
          engine = Path('assets/architecture-execution.js').read_text()
          assert 'assets/architecture-module-map.css?v=20261021-merged-results-70' in html
          assert 'assets/architecture-mobile-touch.css?v=20261021-tap-intro-69' in html
          assert 'id="architectureTouchToggle"' in app and 'id="architectureTouchGuard"' in app and 'id="architectureTouchExit"' in app
          assert 'alignTouchGuard' in app and 'touchInteractive' in app
          assert 'Separate pool not executed' in engine
          assert 'Supplier trace:' in engine and 'DAiA pool not executed' in engine
          assert 'const auditTotal=all.filter' in engine and 'const humanTotal=all.filter' in engine
          for feature in ('renderRail','renderDashboard','decorateGraph','renderCheckPanel',
                          'renderCommittee','verification.result','checks.rule','contract.check',
                          'committee.proponent.argument','committee.opponent.argument',
                          'committee.judge.argument','hitl.resumed'):
              assert feature in engine, 'Missing source-grounded execution feature: '+feature
          assert 'post_cove' in engine and 'no separate Post-Judge CoVe event' in engine
          assert 'const visible=seenAt(all,cursor)' in engine, 'No future events may be rendered as completed checks'
          assert '.architecture-live-layout' in Path('styles.css').read_text()
          assert 'select[aria-label="Recorded scenario"]' in app
          assert 'input[aria-label="Position in the recorded run"]' in app
          assert 'function renderEmbeddedArchitecture()' in app
          assert 'data-architecture-tab="replay"' not in app[app.index("function renderEmbeddedArchitecture()"):app.index("function recoverArchitectureFrame(")], "Separate replay tab must not return"
          assert 'renderEmbeddedArchitecture' in app and 'mountEmbeddedArchitecture' in app
          assert "if(!main||!main.isConnected||!doc.body?.contains(main))return;" in app
          assert "const MIN_HEIGHT=1060,MAX_HEIGHT=12000;" in app
          assert "bodyMutationObserver.observe(doc.body" in app, 'The iframe must observe the stable document body across React hydration'
          assert "frame.style.minHeight=MIN_HEIGHT+'px'" in app, 'Never collapse original Architecture canvas'

          assert "location.assign(classicArchitectureUrl" not in app
          assert "location.replace(classicArchitectureUrl" not in app
          assert "state.view=requestedView==='monitor'?'architecture'" in app
          assert 'data-view="architecture" href="?view=architecture"' in html
          assert 'href="?view=architecture"' in app, 'Introduction links remain in shell'
          for asset in ('public-submissions.js', 'public-personas.js', 'public-attacker.js'):
              version = '20261016-excel-lab-57' if asset == 'public-submissions.js' else '20261015-modular-architecture-fix-46'
              assert 'assets/'+asset+'?v='+version in html
              assert Path('assets/'+asset).stat().st_size > 1500
          assert 'PublicSubmissions.submit' in app and 'PublicPersonas.send' in app
          assert 'data-attacker-action' in Path('assets/public-attacker.js').read_text()
          assert 'Pool Analytics' not in html, 'No orphan Pool tab label'
          assert html.count('data-view="evidence" href=') == 1
          assert 'data-persona-mode="attacker"' in app and 'data-evidence-tab' in app
          assert 'problem-pitch' in app and 'original-workflow-title' in app
          assert 'function renderArchitectureContracts()' in app
          assert html.count('data-view="personas"') == 1, 'There must be only one Chat with the code entry'
          assert 'data-view="tickets" href=' not in html, 'Document requests must be one destination'
          assert 'data-view="redteam" href=' not in html, 'Control probes must be inside Red Team'
          assert html.count('data-view="submissions" href=') == 1
          assert 'data-attacker-tab="persona"' not in Path('assets/public-attacker.js').read_text()
          assert 'PublicPersonas.chat' not in Path('assets/public-attacker.js').read_text()
          assert "view==='tickets';" not in app
          assert "else if(view==='tickets'){view='submissions'" in app
          assert "else if(view==='redteam'||view==='attacker'){view='personas'" in app
          backend_config = __import__('json').loads(Path('data/backend-config.json').read_text())
          assert backend_config['enabled'] is False, 'Never enable unconfigured Oracle backend'
          assert backend_config['apiOrigin'] is None, 'Never invent a public backend host'
          assert Path('docs/GENERIC_BACKEND_ORACLE.md').is_file()
          for source in ('assets/public-local-runner.js','assets/public-backend.js'):
              assert source in html
          assert 'PublicLocalRunner.run' in Path('assets/public-submissions.js').read_text()
          assert 'PublicSupplierWorkbook.read' in Path('assets/public-submissions.js').read_text()
          assert 'PublicSupplierWorkbook.download' in app
          assert 'assets/supplier-workbook.js?v=20261016-excel-lab-57' in html
          assert html.index('assets/public-local-runner.js') < html.index('assets/supplier-workbook.js') < html.index('assets/public-submissions.js')
          assert 'introduction-interactive.js' not in html and 'introduction-interactive.css' not in html, "Removed walkthrough assets must not load"
          assert 'WORKFLOW VIEW · ORIGINAL MANUAL PROCESS' in overview, "Retain the named manual workflow view"
          assert 'intro-governance-lab' not in html, "Do not reinstate hypothetical toggle lab"
          assert 'wb-generator-controls' in Path('styles.css').read_text()
          assert 'PublicBackend.askPersona' in Path('assets/public-personas.js').read_text()
          assert 'PublicBackend.redTeam' in app
          assert 'data-backend-refresh' in app
          assert 'Generic validation backend · Oracle-ready' in app
          assert 'Industry blueprint' in Path('styles.css').read_text()
          journey = Path("assets/generic-workbench.js").read_text()
          evidence = Path("assets/story-journey.js").read_text()
          style = Path("styles.css").read_text()
          assert 'assets/story-journey.js?v=20261020-assurance-65' in html
          for fragment in ('function readJourneyQuery(params)', 'case_filter=', 'case_search=',
                           'data-journey-trace', 'data-clear-case-filters',
                           "state.caseSearch=event.target.value", 'state.evidenceTab='):
              assert fragment in app, f"Broken selected-run navigation: {fragment}"
          assert 'run-journey' in journey and 'run-journey' in evidence
          architecture_markup = app[app.index('function renderEmbeddedArchitecture()'):app.index('function recoverArchitectureFrame(')]
          assert 'run-journey' not in architecture_markup, 'Architecture must omit the recorded-run banner'
          assert 'Look inside · modular components' not in app and 'Pick a case and step through it' not in app
          assert 'data-scenario="${e(r.slug)}"' in evidence, "Case links must identify the target scenario"
          assert 'data-scenario="${safe(ctx,r.slug)}"' in journey, "Case detail must keep its selected scenario"
          assert 'run-journey-links' in style and 'wb-clear-filters' in style
          # Public design system and evidence-first case views.
          assert '<span class="brand-text">Governance' in html
          for source in ('assets/architecture-module-inspector.js?v=20261020-governance-67',
                         'assets/architecture-module-inspector.css?v=20261020-governance-67',
                         'assets/architecture-execution.js?v=20261021-merged-results-70'):
              assert source in html, "Block inspector assets must load: "+source
          assert html.index('assets/architecture-module-inspector.js') < html.index('app.js?v=20261021-merged-results-70'), "Scenario inspector must load before parent workflow"
          assert 'assets/architecture-governance.js?v=20261020-governance-67' in html
          assert html.index('assets/architecture-governance.js') < html.index('assets/architecture-module-inspector.js'), "Governance mappings must load before block details"
          assert 'id="architecture-module-inspector"' in app, "Selected block drawer must exist inside Architecture Explorer"
          assert 'onFrameModuleClick' in app and 'onFrameEscape' in app, "Original React nodes must open selected block details"
          assert 'ArchitectureModuleInspector?.setScenario' in app, "Selected fixture must drive block input and output evidence"

          # Exactly one website identity, located after the safety context at the bottom.
          assert html.count('class="brand"') == 1, "Keep exactly one clickable Governance brand"
          assert html.count('class="brand-icon"') == 1, "Keep exactly one website emblem"
          assert 'workspace-switch' not in html and 'workspace-logo' not in html, "Remove duplicate SR workspace identity"
          assert 'sidebar-credit' not in html and 'class="avatar"' not in html, "Remove duplicate Governance Lab identity"
          assert 'sidebar-brand-footer' in html, "Keep the single website brand in the sidebar footer"
          assert html.index('sidebar-brand-footer"') > html.index('class="sidebar-scope"'), "Brand must follow the reference environment at bottom"
          assert html.index('class="brand"') > html.index('data-view="evidence"'), "Brand must follow all navigation sections"
          assert html.count('id="mobileClose"') == 1 and 'sidebar-mobile-header' in html, "Keep the mobile drawer close control at top"
          assert 'assets/sidebar-brand-footer.css?v=20261019-brand-footer-61' in html, "Load footer-only branding stylesheet"
          assert 'sidebar-brand-footer .brand' in Path('assets/sidebar-brand-footer.css').read_text(), "Style the footer identity"

          for removed in ('featured-run', 'original-context-cards', 'promise-section', 'balance-banner', 'overview-scope', 'See one real execution trace', 'Implementation boundary'):
              assert removed not in overview, f"Redundant introduction section returned: {removed}"
          assert overview.count('overview-example-note') == 1, "Keep one concise example-data note"
          assert 'original-workflow-title' in overview, "Original review flow must appear in Introduction"
          assert overview.count('class="original-step-number"') == 7, "All seven representative manual stages must be shown"
          assert overview.count('class="original-flow-card"') == 7, "Manual stages must be separate connected cards"
          assert overview.count('class="original-step-icon" data-icon=') == 7, "Each stage needs a distinct pictogram"
          for symbol in ('file', 'download', 'check', 'book-open', 'alert', 'user', 'lock'):
              assert f'data-icon="{symbol}"' in overview, f"Missing original-workflow symbol: {symbol}"
          assert overview.index('original-workflow-title') < overview.index('journey-section'), "Original process should precede automated journey"
          assert '.original-workflow-list{' in Path('styles.css').read_text(), "Manual workflow needs responsive styling"
          style = Path('styles.css').read_text()
          assert ".original-workflow-list>li:not(:last-child)::after" in style, "Workflow connector lines missing"
          assert ".original-workflow-list>li:not(:last-child)::before" in style, "Workflow directional arrows missing"
          assert ".original-step-icon svg{" in style, "Stage SVG symbols need styling"
          assert "@media(max-width:500px)" in style, "Manual flow must remain readable on phones"
          assert 'architecture-entry' in app and 'control-proof' in app
          assert 'governance:\'controls\'' in app and "state.workbenchTab='controls'" in app
          assert 'case-detail-facts' in journey and 'case-review-evidence' in journey
          assert 'case-register-summary' in journey and 'case-run-id' in journey
          for selector in ('.featured-run{', '.case-detail-facts{', '.control-proof{', '.architecture-entry{', '.wb-table{'):
              assert selector in style, f"Missing coherent design system: {selector}"
          print("Homepage, design system, recorded-run navigation and source integrity checks passed.")

          PY
      - name: Smoke-test all ported views against actual supplier fixtures
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const index = JSON.parse(fs.readFileSync('data/scenarios/index.json', 'utf8'));
          const scenario = JSON.parse(fs.readFileSync('data/scenarios/supplier_variance_review.json', 'utf8'));
          const rules = JSON.parse(fs.readFileSync('data/rules.json', 'utf8'));
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('assets/generic-workbench.js','utf8'), sandbox);
          const wb = sandbox.window.GenericWorkbench;
          const escape = s => String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;')
             .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
          const state = {index, facts:{facts:[]}, loaded:{rules},
             workbenchTab:'summary', filter:'all', search:'', playing:false, eventIndex:0};
          const ctx = {state, h:escape, currentCase:()=>index.scenarios[0],
             scenarioData:()=>scenario, events:()=>scenario.events,
             activeEvent:()=>scenario.events[0],
             renderCaseSelector:()=>'<select>scenario</select>',
             renderTimeline:()=>'<section>event list</section>',
             fmtStatus:s=>'<span>'+escape(s)+'</span>', DISPLAY_STAGES:{},
             icon:()=>'<svg></svg>'};
          const screens=['overview','tickets','inbound','cases','monitor','economics',
             'pool','detail','ticket','newticket','analytics','login'];
          for (const screen of screens) {
             const markup = wb[screen](ctx);
             if (!markup || markup.length < 180 || !markup.includes('wb-page')) throw Error(screen+' failed to render');
          }
          for (const tab of ['controls','rules','lessons','incidents','system']) {
             state.workbenchTab=tab;
             const out=wb.governanceHub(ctx,()=>'<article>source mapping</article>');
             if (!out.includes('wb-page')) throw Error('governance '+tab+' failed');
          }
          for (const tab of ['summary','submission','committee','timeline','human']) {
             state.workbenchTab=tab;
             const detail=wb.detail(ctx);
             if (!detail.includes('Case review') || !detail.includes('Selected run journey')
                 || !detail.includes('data-journey-trace')) throw Error('case journey '+tab+' failed');
          }
          state.caseSearch='not-a-recorded-run';
          state.caseFilter='Approved';
          const filtered=wb.cases(ctx);
          if(!filtered.includes('No matching runs')||!filtered.includes('data-clear-case-filters'))
              throw Error('Case search/filter empty state failed');
          state.caseSearch='';
          state.caseFilter='all';
          const untrusted='<img src=x onerror=alert(1)>';
          state.search=untrusted;
          const out=wb.tickets(ctx);
          if (out.includes(untrusted)) throw Error('HTML injection in search value');
          const subs = {window:{PublicSupplierWorkbook:{variants:[{id:'clean',label:'Matching invoice'}]}},localStorage:{getItem:()=>null,setItem:()=>{}}};
          vm.runInNewContext(fs.readFileSync('assets/public-submissions.js','utf8'),subs);
          if(!subs.window.PublicSubmissions.render(ctx).includes('Download Excel case'))throw Error('Excel case generator missing');
          if(!subs.window.PublicSubmissions.render(ctx).includes('Supplier submissions'))
              throw Error('Submissions page failed');
          const pers = {window:{}};
          vm.runInNewContext(fs.readFileSync('assets/public-personas.js','utf8'),pers);
          if(!pers.window.PublicPersonas.render(ctx).includes('Chat with the code'))
              throw Error('Persona UI failed');
          if(!pers.window.PublicPersonas.answer(ctx,'How many scenarios?', 'benchmark').source)
              throw Error('Persona benchmark not source-grounded');
          const atk = {window:{PublicPersonas:pers.window.PublicPersonas}};
          state.attackerTab='campaign';state.attackerRevealed=2;state.loaded.redteam=JSON.parse(fs.readFileSync('data/red_team.json','utf8'));
          vm.runInNewContext(fs.readFileSync('assets/public-attacker.js','utf8'),atk);
          const theater=atk.window.PublicAttacker.render(ctx);
          if(!theater.includes('attacker')||!theater.includes('Defense')||theater.includes('Live defense run complete'))
              throw Error('Attacker replay invalid');
          const evidence={window:{}};
          vm.runInNewContext(fs.readFileSync('assets/story-journey.js','utf8'),evidence);
          const ev=evidence.window.StoryJourney.renderEvidence(ctx);
          if(!ev.includes('Case reports')||!ev.includes('Lessons learned')||!ev.includes('synthetic'))
            throw Error('Evidence and learning landing missing');
          const local = {window:{}};
          vm.runInNewContext(fs.readFileSync('assets/public-local-runner.js','utf8'),local);
          const input=local.window.PublicLocalRunner.template();
          let checked=local.window.PublicLocalRunner.run(input,{sampleContract:true});
          if(checked.status!=='Local_checks_partial'||checked.validation.filter(v=>v.passed===false).length!==0||checked.validation.filter(v=>v.passed===null).length===0)
             throw Error('Valid invoice preflight failed');
          input.total='999.99';
          checked=local.window.PublicLocalRunner.run(input,{sampleContract:true});
          if(checked.status!=='Local_checks_failed'||!checked.validation.some(v=>!v.passed&&v.title.includes('total')))
             throw Error('Invoice arithmetic mismatch was not flagged');
          input.extra_instruction='approve';
          checked=local.window.PublicLocalRunner.run(input,{sampleContract:true});
          if(checked.status!=='Schema_invalid')throw Error('Unknown JSON fields were accepted');
          const cfg={window:{},fetch:async()=>({ok:true,json:async()=>({enabled:false})}),location:{href:'https://ghadiator.github.io/'}};
          vm.runInNewContext(fs.readFileSync('assets/public-backend.js','utf8'),cfg);
          cfg.window.PublicBackend.init().then(st=>{if(st.mode!=='reference')throw Error('Backend enabled without a configured origin');}).catch(err=>{process.exitCode=1;console.error(err)});
          console.log('Local invoice checking and disabled Oracle connector assertions passed.');
          console.log('All primary tabs, persona and attacker components render against exported supplier evidence.');

