name: Verify high-resolution agent avatar frontend hotfix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-agent-avatar-hotfix.yml
      - assets/agent-avatar-sharp-7519.js
      - index.html
      - ai-roles/index.html
      - architecture/index.html
permissions:
  contents: read
jobs:
  avatar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Check patch syntax and page inclusion
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/agent-avatar-sharp-7519.js
          for path in index.html ai-roles/index.html architecture/index.html; do
            grep -q 'agent-avatar-sharp-7519.js' "$path"
          done
          ! grep -q 'OCI_SSH_' assets/agent-avatar-sharp-7519.js
      - name: Install headless browser
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
          command -v google-chrome || command -v chromium
      - name: Serve the exact published checkout
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gac-avatar-server.log 2>&1 &
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && exit 0; sleep 1; done
          cat /tmp/gac-avatar-server.log; exit 1
      - name: Check responsive avatars, captions, positioning and no missing roles
        shell: bash
        run: |
          node - <<'JS'
          const assert=require("node:assert/strict");
          const {chromium}=require("playwright-core");
          const fs=require("node:fs");
          const chrome=process.env.CHROME_PATH||["/usr/bin/google-chrome","/usr/bin/chromium"].find(fs.existsSync);
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chrome,args:["--no-sandbox"]});
            try {
              for(const width of [390,768,1440]){
                const page=await browser.newPage({viewport:{width,height:900}});
                const errors=[];page.on("pageerror",x=>errors.push(x.message));
                await page.goto("http://127.0.0.1:8765/",{waitUntil:"load"});
                await page.locator(".gac-patched-agents").waitFor({timeout:18000});
                const panel=page.locator('[aria-labelledby="overview-agent-strip"]');
                assert.equal(await panel.locator('li').count(),8,"Exactly 8 personas");
                assert.equal(await panel.locator('[data-sharp="1"] svg').count(),8,"Crisp vector per persona");
                const x=await page.evaluate(()=>{
                  const h=document.getElementById("introduction-title")?.closest("section");
                  const k=document.querySelector('[aria-labelledby="overview-kpis"]');
                  const a=document.querySelector('[aria-labelledby="overview-agent-strip"]');
                  const names=[...a.querySelectorAll("li strong")].map(x=>x.textContent.trim());
                  const first=a.querySelector('[role="img"]');
                  return {
                    heroBeforeKpi:!!(h.compareDocumentPosition(k)&Node.DOCUMENT_POSITION_FOLLOWING),
                    kpiBeforeAgents:!!(k.compareDocumentPosition(a)&Node.DOCUMENT_POSITION_FOLLOWING),
                    labels:names,
                    size:first?.getBoundingClientRect().width,
                    cardLabelSize:parseFloat(getComputedStyle(a.querySelector("li strong")).fontSize),
                    documentOverflow:document.documentElement.scrollWidth-window.innerWidth
                  };
                });
                assert(x.heroBeforeKpi && x.kpiBeforeAgents,"KPIs must directly follow business case, then personas");
                assert(x.size>=70,"Portrait must be visibly large");
                assert(x.cardLabelSize>=13,"Labels must be legible");
                assert(x.documentOverflow<4,"No horizontal overflow");
                assert.deepEqual(x.labels,["Proponent","Opponent","Judge","Attacker","Analytics","Integrator","Audit","Reporter"]);
                assert.equal(errors.length,0,"No browser exceptions "+errors.join(" | "));
                if(width===768)await panel.screenshot({path:"/tmp/agent-avatar-tablet.png"});
                await page.goto("http://127.0.0.1:8765/ai-roles/",{waitUntil:"load"});
                await page.locator('[data-sharp="1"] svg').first().waitFor({timeout:15000});
                assert((await page.locator('[data-sharp="1"] svg').count())>=8,"Detailed roles share the same vector artwork");
                await page.close();
                console.log("PASS agent avatars, KPI order, role captions and responsive layout at "+width+"px");
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save visual acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-agent-responsive-frontend
          path: /tmp/agent-avatar-tablet.png
          if-no-files-found: ignore
          retention-days: 3
