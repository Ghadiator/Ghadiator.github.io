name: Architecture UI integrity
on:
  pull_request:
    paths:
      - architecture/index.html
      - assets/architecture-explained.js
      - assets/architecture-explained.css
      - _next/static/chunks/app/architecture/page-2d56a5bff821821b.js
      - _next/static/chunks/app/layout-00714e284e207e0e.js
      - .github/workflows/architecture-ui-integrity.yml
  push:
    branches: [main]
    paths:
      - architecture/index.html
      - assets/architecture-explained.js
      - assets/architecture-explained.css
      - _next/static/chunks/app/architecture/page-2d56a5bff821821b.js
      - _next/static/chunks/app/layout-00714e284e207e0e.js
      - .github/workflows/architecture-ui-integrity.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check architecture JavaScript syntax
        run: |
          node --check _next/static/chunks/app/architecture/page-2d56a5bff821821b.js
          node --check assets/architecture-explained.js
      - name: Ensure unwanted panels are removed and evidence preserved
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          html = Path("architecture/index.html").read_text()
          js = Path("_next/static/chunks/app/architecture/page-2d56a5bff821821b.js").read_text()
          assert 'Component <!-- -->13' not in html
          assert 'audit ledger' not in html and 'audit ledger' not in js
          assert 'Empty. Nothing has happened yet.' not in html and 'Empty. Nothing has happened yet.' not in js
          assert 'Recorded from the engine&#x27;s own hermetic fixtures.' not in html
          assert 'grid deck-hair-children' not in html and js, 'Legacy component inspector must not be rendered'
          assert 'Select a component, a route, or an obligation. Three components open further.' not in html
          assert 'children:(0,n.jsx)(ex,{selection:L' not in js
          assert 'data-node="external"' in html, 'Keep Approved contract as a selectable modular diagram block'
          for control in ('token_economics', 'process_semantics', 'post_cove'):
              assert 'data-node="' + control + '"' in html, 'Missing modular block: ' + control
              assert 'id:"' + control + '"' in js, 'Missing React architecture block: ' + control
          for path_id in (
              'proponent→firewall', 'opponent→firewall', 'firewall→judge',
              'judge→post_cove', 'post_cove→advisory',
              'orchestrator→process_semantics', 'disposition→process_semantics',
              'post_cove→token_economics', 'token_economics→post_cove',
          ):
              assert 'data-route="' + path_id + '"' in html, 'Missing graph connector: ' + path_id
              assert 'data-edge="' + path_id + '"' in html, 'Missing graph connector label: ' + path_id
              assert 'id:"' + path_id + '"' in js, 'Missing React graph connector: ' + path_id
          for removed in ('proponent→judge', 'judge→advisory', 'process_semantics→orchestrator'):
              assert 'data-route="' + removed + '"' not in html, 'Obsolete bypass: ' + removed
              assert 'id:"' + removed + '"' not in js, 'Obsolete React bypass: ' + removed
          assert 'D−14' not in html and 'D−14' not in js, 'Remove countdown shorthand from reminder block'
          for term in ('Main orchestrator', 'LangGraph', 'Process semantics pool', 'ProcessEvent', 'Pre-Judge CoVe', 'Post-Judge CoVe'):
              assert term in html and term in js, f'Missing source architecture label: {term}'
          assert 'Human-in-the-loop (HITL)' in html and 'Human-in-the-loop (HITL)' in js, 'Human review block must use HITL'
          assert 'Final disposition</span>' not in html, 'Old HITL label must not remain'
          assert 'validation_workflow/orchestrator.py' in js, 'LangGraph orchestration source missing'
          assert 'validation_workflow/telemetry/emitter.py' in js, 'ProcessEvent pool emitter source missing'
          assert 'pipeline/cove_loop.py' in js, 'Two-layer CoVe source missing'
          assert 'four-proposal limit is not a token budget' in js, 'Do not conflate tokens with proposal limits'
          assert 'data-node="proponent"' in html and 'data-node="opponent"' in html and 'data-node="firewall"' in html and 'data-node="judge"' in html
          guide_source = Path("assets/architecture-explained.js").read_text()
          for marker in ('token_economics:', 'process_semantics:', 'post_cove:', 'disposition:["Human-in-the-loop (HITL)"', 'LangGraph StateGraph', 'ProcessEvent', 'zero live-model tokens', 'none is invented here', 'record.events'):
              assert marker in guide_source, 'Missing connected control evidence: ' + marker
          assert 'SupplierWorkflow' in guide_source and 'supplier fixture' in guide_source, 'Keep the implementation distinction explicit'
          assert '[L,z]=(0,i.useState)(null)' in js
          assert 'if(!o||"node"===o.t&&"disposition"===o.id)' in js
          assert 'lg:grid-cols-[1fr_17rem] lg:divide-x' not in html and js
          assert 'page-2d56a5bff821821b.js?v=20261014-workflow-rails-39' in html
          assert '/assets/architecture-explained.js?v=20261014-workflow-rails-39' in html
          assert '/assets/architecture-explained.css?v=20261014-workflow-rails-39' in html

          # Workflow-wide layers surround the detailed stages; token management
          # is inside the committee rather than appearing as an extra verdict.
          assert 'G={w:1250,h:980}' in js, "Full canvas must include both wide rails"
          wide = {
              'orchestrator': 'x:14,y:12,w:1220,h:76',
              'process_semantics': 'x:14,y:880,w:1220,h:76',
              'token_economics': 'x:440,y:286,w:538,h:66',
          }
          for nid, coords in wide.items():
              start = js.index('id:"'+nid+'"')
              assert coords in js[start:start+1150], f'Wrong scope or position: {nid}'
              assert 'data-node="'+nid+'"' in html
          assert 'label:"COMMITTEE ORCHESTRATION"' in js
          assert 'COMMITTEE ORCHESTRATION' in html
          assert 'M1234,50 L1242,50 L1242,918 L1234,918' in js
          assert 'M1234,50 L1242,50 L1242,918 L1234,918' in html
          assert 'M911,256 L911,286' in js, "CoVe to resource control arrow missing"
          assert 'M978,320 L994,320 L994,244 L978,244' in js, "Bounded revision feedback missing"
          # Both desktop and mobile navigation must remain minimal after hydration.
          shell = Path('_next/static/chunks/app/layout-00714e284e207e0e.js').read_text()
          for forbidden in ('title:"Reception"', 'title:"Oversight"', 'label:"Process audit"'):
              assert forbidden not in shell
          for link in ('/dashboard/', '/cases/', '/requests/', '/audit/', '/safety/',
                       '/governance/', '/red-team/', '/integration/'):
              assert 'href="'+link+'"' not in html, "Removed link visible in exported HTML: "+link
          assert 'label:"Architecture"' in shell and 'label:"Introduction"' in shell
          assert 'Industry blueprint' in Path('assets/architecture-explained.css').read_text()
          assert 'Barlow+Condensed' in html
          for leak in ('VC ingest', 'NI clarification', 'reinsurance quota'):
              assert leak not in html, "Underwriting-specific wording leaked: "+leak
          guide = Path('assets/architecture-explained.js').read_text()
          guide_css = Path('assets/architecture-explained.css').read_text()
          assert html.index('<h1') < html.index('deck overflow-hidden'), "Architecture diagram must lead the page"
          assert '01 / INTERACTIVE MODULAR ARCHITECTURE' in guide_css, "Architecture is section 01"
          sections = ('02 / UNDERSTAND THE COMPONENT', '03 / RECORDED WORKFLOW RESULT', '04 / EU AI ACT GOVERNANCE VIEW')
          assert all(section in guide for section in sections), "The sections below architecture must be numbered 02 through 04"
          assert guide.index(sections[0]) < guide.index(sections[1]) < guide.index(sections[2]), "Sections must remain in explanatory, results, governance order"
          assert 'root.previousElementSibling!==deck' in guide and 'deck.insertAdjacentElement("afterend",root)' in guide, "Companion content must remain directly after the modular architecture"
          for term in ('What is it?', 'What does it do?', 'Why is it included?', 'What does it cover and what are its limits?', 'What actually happened?', 'EU AI ACT GOVERNANCE VIEW', 'proponent', 'opponent', 'firewall', 'judge', 'record.events', 'scope'):
              assert term in guide, f'Missing architecture guide: {term}'
          assert 'document.querySelector("main .deck")' in guide
          assert 'not a claim of EU AI Act compliance' in guide
          for term in ("Proponent", "Opponent", "Pre-Judge CoVe", "Judge", 'data-node="disposition"'):
              assert term in html, f"Keep architecture blocks: {term}"
          for path, sha in {
              "data/facts.json":"15987cfbcb97c404fe71865881da5457adc5546d",
              "data/scenarios/index.json":"f384fc608e6c38bc0df9257cd4af7842f7ca7476"
          }.items():
              actual = subprocess.check_output(["git","hash-object",path], text=True).strip()
              assert actual == sha, f"Recorded evidence changed: {path}"
          print("Architecture inspector and recorded-evidence checks passed.")
          PY
