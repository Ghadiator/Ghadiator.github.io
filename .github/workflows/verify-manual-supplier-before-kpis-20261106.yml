name: Verify standalone manual workflow before KPI Group A
on:
  pull_request:
    paths:
      - "assets/manual-supplier-invoice-workflow-20261106.svg"
      - "assets/manual-supplier-invoice-workflow-mobile-20261106.svg"
      - "assets/introduction-order-and-kpis-20261106.css"
      - "assets/kpi-manual-delta-20261106.css"
      - ".github/workflows/verify-manual-supplier-before-kpis-20261106.yml"
  push:
    branches: [main]
    paths:
      - "assets/manual-supplier-invoice-workflow-20261106.svg"
      - "assets/manual-supplier-invoice-workflow-mobile-20261106.svg"
      - "assets/introduction-order-and-kpis-20261106.css"
      - "assets/kpi-manual-delta-20261106.css"
      - ".github/workflows/verify-manual-supplier-before-kpis-20261106.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify redesigned SVG semantics and separate KPI styling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          required=['Receive &amp; triage','Read &amp; enter data','Match documents','Question exceptions','Prepare findings','Human decision','Update &amp; archive','Email overload','Manual re-entry','Scattered sources','Slow follow-ups','Repetitive reporting','Approval bottleneck','Weak traceability','Intake coordinator','AP administrator','Contract analyst','Quality checker','Case preparer','Decision owner','Records / audit clerk']
          for path in [Path('assets/manual-supplier-invoice-workflow-20261106.svg'),Path('assets/manual-supplier-invoice-workflow-mobile-20261106.svg')]:
              data=path.read_text()
              assert ET.fromstring(data).tag.endswith('svg'), path
              for term in required: assert term in data, (path,term)
              for bad in ['<script','<foreignObject','javascript:','AUTOMATED WORKFLOW','AI-ASSISTED WORKFLOW']:
                  assert bad not in data, (path,bad)
              print('Manual content and vector valid:',path)
          source=Path('assets/introduction-order-and-kpis-20261106.css').read_text()
          assert 'Standalone MANUAL workflow' in source
          assert '::after' in source and 'order: 1 !important' in source
          assert 'manual-supplier-invoice-workflow-mobile-20261106.svg' in source
          kpi=Path('assets/kpi-manual-delta-20261106.css').read_text()
          assert '#gac-kpi-manual-comparison::before { content: none !important' in kpi
          print('Manual standalone section and KPI boundary verified')
          PY
      - name: Install browser tooling
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
          command -v google-chrome || command -v chromium
      - name: Serve public files
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gac-manual-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && exit 0; sleep 1; done
          cat /tmp/gac-manual-http.log; exit 1
      - name: Verify standalone workflow separation at 1440, 768 and 390px
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright-core'),cp=require('child_process'),fs=require('fs');
          (async()=>{
            const executablePath=cp.execFileSync('sh',['-c','command -v google-chrome || command -v chromium']).toString().trim();
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            fs.mkdirSync('/tmp/gac-manual',{recursive:true});
            for (const width of [1440,768,390]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
              const data=await page.evaluate(()=>{
                const root=document.querySelector('main .space-y-12:has(#gac-kpi-manual-comparison)');
                const k=document.querySelector('#gac-kpi-manual-comparison');
                const hero=document.querySelector('#introduction-title')?.closest('section');
                if(!root||!k||!hero)return null;
                const pseudo=getComputedStyle(root,'::after');
                const inside=getComputedStyle(k,'::before');
                const header=k.querySelector('.gac-kpi-head');
                const heading=k.querySelector('#overview-kpis');
                return {
                  manualBg:pseudo.backgroundImage,
                  manualOrder:pseudo.order,
                  manualHeight:parseFloat(pseudo.height),
                  manualDisplay:pseudo.display,
                  kpiOrder:getComputedStyle(k).order,
                  insideContent:inside.content,
                  insideDisplay:inside.display,
                  heroBottom:hero.getBoundingClientRect().bottom,
                  kpiTop:k.getBoundingClientRect().top,
                  headerTop:header.getBoundingClientRect().top,
                  headerText:header.textContent,
                  heading:heading.textContent,
                  kpiPadding:getComputedStyle(k).paddingTop
                };
              });
              if(!data)throw new Error('Required sections missing '+width);
              const expected=width<=760?'manual-supplier-invoice-workflow-mobile-20261106.svg':'manual-supplier-invoice-workflow-20261106.svg';
              if(!data.manualBg.includes(expected))throw new Error('Wrong visual '+width+' '+JSON.stringify(data));
              if(data.manualOrder!=='1'||data.kpiOrder!=='2')throw new Error('Workflow/KPI not separately ordered '+width+' '+JSON.stringify(data));
              if(data.insideContent!=='none'||data.insideDisplay!=='none')throw new Error('Old visual remains inside KPI '+width+' '+JSON.stringify(data));
              if(data.manualHeight < (width<=760?520:160))throw new Error('Manual graphic has invalid height '+width+' '+JSON.stringify(data));
              if(data.kpiTop < data.heroBottom+data.manualHeight-30)throw new Error('Visual not preceding KPI panel '+width+' '+JSON.stringify(data));
              if(!data.headerText.includes('Pre-existing business KPIs')||!data.heading.includes('Group A'))throw new Error('KPI heading changed');
              const response=await page.request.get('http://127.0.0.1:8765/assets/'+expected);
              if(!response.ok())throw new Error('Missing vector '+width);
              await page.screenshot({path:'/tmp/gac-manual/introduction-'+width+'.png',fullPage:true});
              console.log('PASS',width,JSON.stringify(data));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Retain review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-manual-workflow-design-review
          path: /tmp/gac-manual/*.png
          if-no-files-found: ignore
          retention-days: 5
