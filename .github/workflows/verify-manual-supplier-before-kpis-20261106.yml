name: Verify standalone manual workflow before KPI Group A
# Native layout replaces the retired November 6 CSS-overlay implementation.
on:
  pull_request:
    paths:
      - "index.html"
      - "_next/static/**"
      - "scripts/check-native-introduction-visuals.cjs"
      - "scripts/check-native-introduction-svg.py"
      - ".github/workflows/verify-manual-supplier-before-kpis-20261106.yml"
      - "business-impact/index.html"
      - "visuals/manual-supplier-invoice-workflow-20261118.svg"
      - "visuals/manual-supplier-invoice-workflow-mobile-20261118.svg"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "_next/static/**"
      - "scripts/check-native-introduction-visuals.cjs"
      - "scripts/check-native-introduction-svg.py"
      - ".github/workflows/verify-manual-supplier-before-kpis-20261106.yml"
      - "business-impact/index.html"
      - "visuals/manual-supplier-invoice-workflow-20261118.svg"
      - "visuals/manual-supplier-invoice-workflow-mobile-20261118.svg"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify native SVG syntax, semantics and safety
        run: python3 scripts/check-native-introduction-svg.py manual
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
          command -v google-chrome || command -v chromium
      - name: Serve public files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/native-intro-http.log" 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/native-intro-http.log"; exit 1
      - name: Verify current native placement and capture evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/native-intro-manual
        run: node scripts/check-native-introduction-visuals.cjs manual
      - name: Retain review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-intro-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-intro-manual/*.png
          if-no-files-found: warn
          retention-days: 5
